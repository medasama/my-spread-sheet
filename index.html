<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>お金の帳簿</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#f5f5f3; --card:#ffffff; --ink:#1f1f1f; --sub:#767672;
    --accent:#2f6f5e; --accent-light:#e5f0ec; --border:#e2e0da; --danger:#b3543f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:40px;
  }
  header{ padding:16px 16px 8px; display:flex; justify-content:space-between; align-items:flex-start; }
  .header-titles{ flex:1; }
  h1{ font-size:18px; margin:0 0 4px; }
  .sub{ color:var(--sub); font-size:12px; }

  .header-export{ display:flex; gap:12px; padding-top:2px; }
  .export-link{
    background:none; border:none; color:var(--accent); font-size:12px; font-weight:600;
    text-decoration:underline; padding:0;
  }

  .tabs{
    display:flex; gap:6px; overflow-x:auto; padding:12px 16px 4px;
    -webkit-overflow-scrolling:touch;
  }
  .tab-btn{
    flex:0 0 auto; padding:8px 14px; border-radius:20px; border:1px solid var(--border);
    background:var(--card); color:var(--sub); font-size:14px; white-space:nowrap;
  }
  .tab-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .tab-add{
    flex:0 0 auto; padding:8px 12px; border-radius:20px; border:1px dashed var(--border);
    background:transparent; color:var(--accent); font-size:14px;
  }

  main{ padding:8px 16px 0; max-width:640px; margin:0 auto; }

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:14px; margin-bottom:12px;
  }

  .sum-card{
    background:var(--accent-light); border:1px solid var(--accent);
    text-align:center; padding:16px;
  }
  .sum-label{ font-size:12px; color:var(--accent); margin-bottom:4px; }
  .sum-value{ font-size:28px; font-weight:700; color:var(--accent); }
  .sum-count{ font-size:12px; color:var(--sub); margin-top:4px; }
  .sum-breakdown{ font-size:12px; color:var(--sub); margin-top:8px; display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
  .sum-breakdown b{ color:var(--ink); }

  .filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .filter-row select, .filter-row input{
    flex:1 1 auto; min-width:100px; padding:8px 10px; border:1px solid var(--border);
    border-radius:8px; font-size:14px; background:#fff;
  }
  .date-range{ display:none; gap:8px; margin-top:8px; }
  .date-range.show{ display:flex; }

  form.entry-form{ display:flex; flex-direction:column; gap:8px; }
  .entry-form .row{ display:flex; gap:8px; }
  .entry-form input{
    flex:1; min-width:0; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:14px;
  }
  .entry-form button{
    padding:10px; border:none; border-radius:8px; background:var(--accent); color:#fff;
    font-size:14px; font-weight:600;
  }

  .store-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .store-chip{
    padding:4px 12px; border-radius:14px; border:1px solid var(--border);
    background:#fff; color:var(--sub); font-size:12px;
  }

  .entry-list{ display:flex; flex-direction:column; gap:6px; }
  .entry{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 4px; border-bottom:1px solid var(--border); font-size:14px; gap:8px;
  }
  .entry:last-child{ border-bottom:none; }
  .entry-check{ flex:0 0 auto; width:20px; height:20px; accent-color:var(--accent); }
  .entry-body{ display:flex; justify-content:space-between; align-items:center; flex:1; min-width:0; }
  .entry-main{ display:flex; flex-direction:column; min-width:0; }
  .entry-item{ font-weight:600; }
  .entry-meta{ font-size:12px; color:var(--sub); }
  .entry-amount{ font-weight:700; margin-left:8px; white-space:nowrap; }
  .entry-del{ background:none; border:none; color:var(--danger); font-size:12px; margin-left:8px; }
  .entry-settled .entry-item, .entry-settled .entry-amount{ text-decoration:line-through; opacity:0.55; }
  .entry-settled .entry-meta{ opacity:0.55; }

  .empty{ text-align:center; color:var(--sub); font-size:13px; padding:20px 0; }

  .tab-manage{ display:flex; gap:8px; font-size:12px; color:var(--sub); margin-top:8px; }
  .tab-manage button{ background:none; border:none; color:var(--sub); text-decoration:underline; font-size:12px; padding:0; }

  .toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:#1f1f1f; color:#fff; padding:8px 16px; border-radius:20px; font-size:13px;
    opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .toast.show{ opacity:0.92; }

  .entry{ cursor:pointer; }
  .entry-editing{ background:var(--accent-light); border-radius:8px; }

  .form-actions{ display:flex; gap:8px; }
  .form-actions button{ flex:1; }
  .btn-cancel{ background:#fff !important; color:var(--sub) !important; border:1px solid var(--border) !important; }

  #printArea{ display:none; }

  #printArea.capture{
    display:block; position:fixed; left:-10000px; top:0; width:760px;
    background:#fff; padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  }
  #printArea.capture h2{ font-size:18px; margin:0 0 6px; }
  #printArea.capture .print-meta{ font-size:13px; color:#555; margin-bottom:14px; }
  #printArea.capture table{ width:100%; border-collapse:collapse; font-size:13px; }
  #printArea.capture th, #printArea.capture td{ border:1px solid #999; padding:8px 10px; text-align:left; }
  #printArea.capture th{ background:#eee; }
  #printArea.capture td.num, #printArea.capture th.num{ text-align:right; }
  #printArea.capture tfoot td{ font-weight:700; background:#f5f5f5; }

  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{
      display:block; position:absolute; top:0; left:0; width:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    }
    #printArea h2{ font-size:16px; margin:0 0 4px; }
    #printArea .print-meta{ font-size:12px; color:#555; margin-bottom:12px; }
    #printArea table{ width:100%; border-collapse:collapse; font-size:12px; }
    #printArea th, #printArea td{ border:1px solid #999; padding:6px 8px; text-align:left; }
    #printArea th{ background:#eee; }
    #printArea td.num, #printArea th.num{ text-align:right; }
    #printArea tfoot td{ font-weight:700; background:#f5f5f5; }
  }

  .link-modal{
    position:fixed; inset:0; background:rgba(0,0,0,.45);
    display:none; align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .link-modal.show{ display:flex; }
  .link-modal-card{
    background:#fff; border-radius:14px; padding:20px; max-width:340px; width:100%;
  }
  .link-modal-card h3{ font-size:15px; margin:0 0 12px; }
  .link-url-input{
    width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;
    font-size:13px; margin-bottom:10px; background:#f9f9f8;
  }
  .link-modal-actions{ display:flex; gap:8px; margin-bottom:8px; }
  .link-modal-actions button, .link-modal-actions a{
    flex:1; padding:10px; border:none; border-radius:8px; font-size:13px; font-weight:600;
    text-align:center; text-decoration:none; cursor:pointer;
  }
  .btn-copy{ background:var(--accent); color:#fff; }
  .btn-line{ background:#06c755; color:#fff; }
  .link-modal-close{
    display:block; width:100%; background:none; border:none; color:var(--sub);
    font-size:12px; padding:6px; text-decoration:underline;
  }
</style>
</head>
<body>

<header>
  <div class="header-titles">
    <h1>お金の帳簿</h1>
    <div class="sub" id="connStatus">接続中...</div>
  </div>
  <div class="header-export">
    <button type="button" class="export-link" id="pdfBtn">PDF出力</button>
    <button type="button" class="export-link" id="pdfLinkBtn">PDFリンク</button>
    <button type="button" class="export-link" id="csvBtn">CSV出力</button>
  </div>
</header>

<div class="tabs" id="tabBar"></div>

<main>
  <div class="card sum-card">
    <div class="sum-label">合計</div>
    <div class="sum-value" id="sumValue">¥0</div>
    <div class="sum-count" id="sumCount">0件</div>
    <div class="sum-breakdown" id="sumBreakdown"></div>
  </div>

  <div class="card">
    <form class="entry-form" id="entryForm">
      <input type="hidden" id="editingId" value="">
      <div class="row">
        <input type="date" id="inpDate" required>
        <input type="text" id="inpStore" placeholder="店舗">
      </div>
      <div class="store-chips" id="storeChips"></div>
      <input type="number" id="inpAmount" placeholder="金額" required inputmode="numeric">
      <input type="text" id="inpNote" placeholder="品目・メモ（任意）">
      <div class="form-actions">
        <button type="button" class="btn-cancel" id="cancelEditBtn" style="display:none;">キャンセル</button>
        <button type="submit" id="submitBtn">追加</button>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="filter-row">
      <select id="periodSelect">
        <option value="thisMonth">今月</option>
        <option value="lastMonth">先月</option>
        <option value="all">全期間</option>
        <option value="custom">期間を指定</option>
      </select>
      <select id="settledSelect">
        <option value="all">精算状況：すべて</option>
        <option value="unsettled">未精算のみ</option>
        <option value="settled">精算済みのみ</option>
      </select>
    </div>
    <div class="filter-row">
      <select id="storeFilterSelect">
        <option value="all">すべての店舗</option>
      </select>
      <input type="text" id="keyword" placeholder="品目・メモで絞り込み">
    </div>
    <div class="date-range" id="customRange">
      <input type="date" id="rangeFrom">
      <input type="date" id="rangeTo">
    </div>
  </div>

  <div class="card">
    <div class="entry-list" id="entryList"></div>
    <div class="empty" id="emptyMsg" style="display:none;">この条件のデータはまだありません</div>
  </div>

  <div class="tab-manage">
    <button id="renameTabBtn">タブ名を変更</button>
    <button id="deleteTabBtn">このタブを削除</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<div id="printArea"></div>

<div class="link-modal" id="linkModal">
  <div class="link-modal-card">
    <h3>PDFのリンクができました</h3>
    <input type="text" class="link-url-input" id="linkUrlInput" readonly onclick="this.select()">
    <div class="link-modal-actions">
      <button type="button" class="btn-copy" id="copyLinkBtn">リンクをコピー</button>
      <a href="#" class="btn-line" id="lineShareLink" target="_blank" rel="noopener">LINEで送る</a>
    </div>
    <button type="button" class="link-modal-close" id="closeLinkModalBtn">閉じる</button>
  </div>
</div>

<script>
// ▼▼▼ ここを自分のSupabaseプロジェクトの値に書き換えてください ▼▼▼
const SUPABASE_URL = "https://edfrjxjdzxutcjeayfac.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GVtanlT_gDwSEQSsZPC_NQ_nEK-60x2";
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let tabs = [];
let currentTab = null;
let entries = [];

const $ = (id) => document.getElementById(id);

function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

async function init(){
  $("inpDate").value = todayStr();
  await loadTabs();
  wireEvents();
}

async function loadTabs(){
  const { data, error } = await sb.from("money_tabs").select("*").order("sort_order", { ascending:true });
  if (error){ $("connStatus").textContent = "接続エラー: " + error.message; return; }
  tabs = data;
  $("connStatus").textContent = "";
  if (!currentTab && tabs.length) currentTab = tabs[0].name;
  renderTabs();
  if (currentTab) await loadEntries();
}

function renderTabs(){
  const bar = $("tabBar");
  bar.innerHTML = "";
  tabs.forEach(t=>{
    const b = document.createElement("button");
    b.className = "tab-btn" + (t.name === currentTab ? " active" : "");
    b.textContent = t.name;
    b.onclick = async ()=>{ currentTab = t.name; renderTabs(); await loadEntries(); };
    bar.appendChild(b);
  });
  const add = document.createElement("button");
  add.className = "tab-add";
  add.textContent = "＋タブ追加";
  add.onclick = addTab;
  bar.appendChild(add);
}

async function addTab(){
  const name = prompt("新しいタブ名を入力してください（例：日用品、〇〇の医療費 など）");
  if (!name) return;
  const maxOrder = tabs.reduce((m,t)=>Math.max(m, t.sort_order||0), 0);
  const { error } = await sb.from("money_tabs").insert({ name, sort_order: maxOrder + 1 });
  if (error){ toast("追加失敗: " + error.message); return; }
  currentTab = name;
  await loadTabs();
}

async function renameCurrentTab(){
  if (!currentTab) return;
  const name = prompt("新しいタブ名", currentTab);
  if (!name || name === currentTab) return;
  const { error: e1 } = await sb.from("money_tabs").update({ name }).eq("name", currentTab);
  if (e1){ toast("変更失敗: " + e1.message); return; }
  await sb.from("money_entries").update({ tab_name: name }).eq("tab_name", currentTab);
  currentTab = name;
  await loadTabs();
}

async function deleteCurrentTab(){
  if (!currentTab) return;
  if (!confirm(`「${currentTab}」タブとその中の全データを削除します。よろしいですか？`)) return;
  await sb.from("money_entries").delete().eq("tab_name", currentTab);
  await sb.from("money_tabs").delete().eq("name", currentTab);
  currentTab = null;
  await loadTabs();
}

async function loadEntries(){
  const { data, error } = await sb.from("money_entries")
    .select("*")
    .eq("tab_name", currentTab)
    .order("entry_date", { ascending:false });
  if (error){ toast("読み込み失敗: " + error.message); return; }
  entries = data;
  render();
}

function getPeriodRange(){
  const period = $("periodSelect").value;
  const now = new Date();
  if (period === "thisMonth"){
    const from = new Date(now.getFullYear(), now.getMonth(), 1);
    const to = new Date(now.getFullYear(), now.getMonth()+1, 0);
    return [from.toISOString().slice(0,10), to.toISOString().slice(0,10)];
  }
  if (period === "lastMonth"){
    const from = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const to = new Date(now.getFullYear(), now.getMonth(), 0);
    return [from.toISOString().slice(0,10), to.toISOString().slice(0,10)];
  }
  if (period === "custom"){
    return [$("rangeFrom").value || null, $("rangeTo").value || null];
  }
  return [null, null];
}

function render(){
  const [from, to] = getPeriodRange();
  const kw = $("keyword").value.trim().toLowerCase();
  const settledMode = $("settledSelect").value;
  const storeFilter = $("storeFilterSelect").value;

  const scoped = entries.filter(e=>{
    if (from && e.entry_date < from) return false;
    if (to && e.entry_date > to) return false;
    if (storeFilter !== "all" && (e.store || "") !== storeFilter) return false;
    if (kw){
      const hay = ((e.item||"") + " " + (e.memo||"")).toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  });

  const filtered = scoped.filter(e=>{
    if (settledMode === "unsettled") return !e.settled;
    if (settledMode === "settled") return !!e.settled;
    return true;
  });

  const sum = filtered.reduce((s,e)=>s + Number(e.amount||0), 0);
  $("sumValue").textContent = "¥" + sum.toLocaleString();
  $("sumCount").textContent = filtered.length + "件";

  const unsettledSum = scoped.filter(e=>!e.settled).reduce((s,e)=>s + Number(e.amount||0), 0);
  const settledSum = scoped.filter(e=>e.settled).reduce((s,e)=>s + Number(e.amount||0), 0);
  $("sumBreakdown").innerHTML = `未精算 <b>¥${unsettledSum.toLocaleString()}</b> ・ 精算済み <b>¥${settledSum.toLocaleString()}</b>`;

  const list = $("entryList");
  list.innerHTML = "";
  $("emptyMsg").style.display = filtered.length ? "none" : "block";

  filtered.forEach(e=>{
    const row = document.createElement("div");
    row.className = "entry" + (e.id === $("editingId").value ? " entry-editing" : "") + (e.settled ? " entry-settled" : "");
    row.innerHTML = `
      <input type="checkbox" class="entry-check" data-id="${e.id}" ${e.settled ? "checked" : ""} title="精算済みにする">
      <div class="entry-body">
        <div class="entry-main">
          <span class="entry-item">${escapeHtml(e.store || "(店舗未入力)")}</span>
          <span class="entry-meta">${e.entry_date}${e.item ? " ・ " + escapeHtml(e.item) : ""}${e.memo ? " ・ " + escapeHtml(e.memo) : ""}</span>
        </div>
        <div style="display:flex; align-items:center;">
          <span class="entry-amount">¥${Number(e.amount).toLocaleString()}</span>
          <button class="entry-del" data-id="${e.id}">削除</button>
        </div>
      </div>
    `;
    row.addEventListener("click", (ev)=>{
      if (ev.target.classList.contains("entry-del")) return;
      if (ev.target.classList.contains("entry-check")) return;
      startEdit(e);
    });
    list.appendChild(row);
  });

  list.querySelectorAll(".entry-del").forEach(btn=>{
    btn.onclick = async (ev)=>{
      ev.stopPropagation();
      if (!confirm("この記録を削除します。よろしいですか？")) return;
      const id = btn.getAttribute("data-id");
      const { error } = await sb.from("money_entries").delete().eq("id", id);
      if (error){ toast("削除失敗: " + error.message); return; }
      if ($("editingId").value === id) cancelEdit();
      await loadEntries();
    };
  });

  list.querySelectorAll(".entry-check").forEach(chk=>{
    chk.onclick = (ev)=> ev.stopPropagation();
    chk.onchange = async ()=>{
      const id = chk.getAttribute("data-id");
      const { error } = await sb.from("money_entries").update({ settled: chk.checked }).eq("id", id);
      if (error){ toast("更新失敗: " + error.message); chk.checked = !chk.checked; return; }
      await loadEntries();
    };
  });

  renderStoreChips();
  renderStoreFilterOptions();
  window.__lastFiltered = filtered;
}

function storeCounts(){
  const counts = {};
  entries.forEach(e=>{
    const s = (e.store || "").trim();
    if (!s) return;
    counts[s] = (counts[s] || 0) + 1;
  });
  return counts;
}

function renderStoreChips(){
  const box = $("storeChips");
  if (!box) return;
  const counts = storeCounts();
  const names = Object.keys(counts).sort((a,b)=> counts[b]-counts[a]).slice(0, 8);
  box.innerHTML = "";
  names.forEach(name=>{
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "store-chip";
    chip.textContent = name;
    chip.onclick = ()=>{ $("inpStore").value = name; };
    box.appendChild(chip);
  });
}

function renderStoreFilterOptions(){
  const sel = $("storeFilterSelect");
  if (!sel) return;
  const prev = sel.value || "all";
  const counts = storeCounts();
  const names = Object.keys(counts).sort((a,b)=> counts[b]-counts[a]);
  sel.innerHTML = `<option value="all">すべての店舗</option>` +
    names.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join("");
  sel.value = names.includes(prev) || prev === "all" ? prev : "all";
}

function startEdit(e){
  $("editingId").value = e.id;
  $("inpDate").value = e.entry_date;
  $("inpAmount").value = e.amount;
  $("inpStore").value = e.store || "";
  $("inpNote").value = [e.item, e.memo].filter(Boolean).join(" ・ ");
  $("submitBtn").textContent = "更新";
  $("cancelEditBtn").style.display = "block";
  render();
  $("entryForm").scrollIntoView({ behavior:"smooth", block:"center" });
}

function cancelEdit(){
  $("editingId").value = "";
  $("inpStore").value = "";
  $("inpAmount").value = "";
  $("inpNote").value = "";
  $("inpDate").value = todayStr();
  $("submitBtn").textContent = "追加";
  $("cancelEditBtn").style.display = "none";
  render();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function wireEvents(){
  $("periodSelect").onchange = ()=>{
    $("customRange").classList.toggle("show", $("periodSelect").value === "custom");
    render();
  };
  $("keyword").oninput = render;
  $("rangeFrom").onchange = render;
  $("rangeTo").onchange = render;
  $("settledSelect").onchange = render;
  $("storeFilterSelect").onchange = render;

  $("entryForm").onsubmit = async (ev)=>{
    ev.preventDefault();
    if (!currentTab){ toast("先にタブを作成してください"); return; }
    const payload = {
      tab_name: currentTab,
      entry_date: $("inpDate").value,
      item: "",
      store: $("inpStore").value.trim(),
      amount: Number($("inpAmount").value),
      memo: $("inpNote").value.trim()
    };
    const editingId = $("editingId").value;

    if (editingId){
      const { error } = await sb.from("money_entries").update(payload).eq("id", editingId);
      if (error){ toast("更新失敗: " + error.message); return; }
      toast("更新しました");
      cancelEdit();
    } else {
      const { error } = await sb.from("money_entries").insert(payload);
      if (error){ toast("追加失敗: " + error.message); return; }
      $("inpStore").value = "";
      $("inpAmount").value = "";
      $("inpNote").value = "";
      $("inpDate").value = todayStr();
      toast("追加しました");
    }
    await loadEntries();
  };

  $("cancelEditBtn").onclick = cancelEdit;
  $("renameTabBtn").onclick = renameCurrentTab;
  $("deleteTabBtn").onclick = deleteCurrentTab;
  $("pdfBtn").onclick = exportPDF;
  $("pdfLinkBtn").onclick = exportPDFLink;
  $("csvBtn").onclick = exportCSV;
  $("copyLinkBtn").onclick = copyLinkUrl;
  $("closeLinkModalBtn").onclick = hideLinkModal;
  $("linkModal").onclick = (ev)=>{ if (ev.target.id === "linkModal") hideLinkModal(); };
}

function periodLabel(){
  const period = $("periodSelect").value;
  if (period === "thisMonth") return "今月";
  if (period === "lastMonth") return "先月";
  if (period === "all") return "全期間";
  const [from, to] = getPeriodRange();
  if (from || to) return `${from || "…"} 〜 ${to || "…"}`;
  return "全期間";
}

function buildPrintHtml(filtered){
  const kw = $("keyword").value.trim();
  const sum = filtered.reduce((s,e)=>s + Number(e.amount||0), 0);

  const rows = filtered.map(e => `
    <tr>
      <td>${e.entry_date}</td>
      <td>${escapeHtml(e.store || "")}</td>
      <td class="num">¥${Number(e.amount).toLocaleString()}</td>
      <td>${escapeHtml([e.item, e.memo].filter(Boolean).join(" ・ "))}</td>
      <td>${e.settled ? "済" : "未"}</td>
    </tr>
  `).join("");

  return `
    <h2>お金の帳簿 - ${escapeHtml(currentTab)}</h2>
    <div class="print-meta">期間: ${periodLabel()}${kw ? " ／ キーワード: " + escapeHtml(kw) : ""} ／ 出力日: ${todayStr()}</div>
    <table>
      <thead>
        <tr><th>日付</th><th>店舗</th><th class="num">金額</th><th>品目・メモ</th><th>精算</th></tr>
      </thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr><td colspan="2">合計（${filtered.length}件）</td><td class="num">¥${sum.toLocaleString()}</td><td colspan="2"></td></tr>
      </tfoot>
    </table>
  `;
}

function exportPDF(){
  const filtered = window.__lastFiltered || [];
  if (!filtered.length){ toast("出力するデータがありません"); return; }

  $("printArea").innerHTML = buildPrintHtml(filtered);

  window.print();
}

async function exportPDFLink(){
  const filtered = window.__lastFiltered || [];
  if (!filtered.length){ toast("出力するデータがありません"); return; }
  if (typeof html2canvas === "undefined" || !window.jspdf){
    toast("PDF作成の準備に失敗しました（通信環境を確認してください）");
    return;
  }

  toast("PDFを作成中...");
  const area = $("printArea");
  area.innerHTML = buildPrintHtml(filtered);
  area.classList.add("capture");

  try{
    const canvas = await html2canvas(area, { scale: 2, backgroundColor: "#ffffff" });

    const { jsPDF } = window.jspdf;
    const pageWidthMm = 210;
    const pageHeightMm = 297;
    const imgWidthMm = pageWidthMm;
    const imgHeightMm = canvas.height * imgWidthMm / canvas.width;
    const imgData = canvas.toDataURL("image/png");

    const pdf = new jsPDF({ unit: "mm", format: "a4" });
    let heightLeft = imgHeightMm;
    let position = 0;

    pdf.addImage(imgData, "PNG", 0, position, imgWidthMm, imgHeightMm);
    heightLeft -= pageHeightMm;

    while (heightLeft > 0){
      position = heightLeft - imgHeightMm;
      pdf.addPage();
      pdf.addImage(imgData, "PNG", 0, position, imgWidthMm, imgHeightMm);
      heightLeft -= pageHeightMm;
    }

    const blob = pdf.output("blob");
    const path = `${currentTab}/${Date.now()}.pdf`;

    const { error: upErr } = await sb.storage.from("money-tabs-pdfs").upload(path, blob, {
      contentType: "application/pdf",
      upsert: true
    });
    if (upErr){
      toast("アップロード失敗: " + upErr.message);
      return;
    }

    const { data } = sb.storage.from("money-tabs-pdfs").getPublicUrl(path);
    showLinkModal(data.publicUrl);
  } catch(err){
    toast("PDF作成に失敗しました: " + err.message);
  } finally {
    area.classList.remove("capture");
  }
}

function showLinkModal(url){
  $("linkUrlInput").value = url;
  const shareText = encodeURIComponent(`${currentTab}の記録\n${url}`);
  $("lineShareLink").href = `https://line.me/R/msg/text/?${shareText}`;
  $("linkModal").classList.add("show");
}

function hideLinkModal(){
  $("linkModal").classList.remove("show");
}

async function copyLinkUrl(){
  const url = $("linkUrlInput").value;
  try{
    await navigator.clipboard.writeText(url);
    toast("リンクをコピーしました");
  } catch(err){
    $("linkUrlInput").select();
    toast("選択されたリンクをコピーしてください");
  }
}

function csvEscape(v){
  const s = String(v ?? "");
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCSV(){
  const filtered = window.__lastFiltered || [];
  if (!filtered.length){ toast("出力するデータがありません"); return; }

  const header = ["日付","店舗","金額","品目・メモ","精算状況"];
  const lines = [header.join(",")];
  filtered.forEach(e=>{
    lines.push([
      e.entry_date,
      csvEscape(e.store || ""),
      Number(e.amount),
      csvEscape([e.item, e.memo].filter(Boolean).join(" ・ ")),
      e.settled ? "済" : "未"
    ].join(","));
  });

  // Googleスプレッドシート/Excelで日本語が文字化けしないようUTF-8 BOMを付与
  const csvContent = "﻿" + lines.join("\r\n");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${currentTab}_${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("CSVをダウンロードしました");
}

init();
</script>
